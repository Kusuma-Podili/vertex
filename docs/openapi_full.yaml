openapi: 3.0.3
info:
  title: Enterprise Multi-Tenant E-Commerce REST API Specification
  description: Complete, production-level API documentation for Storefront, Admin Backoffice, Logistics, and Webhooks.
  version: 1.0.0
  contact:
    name: Enterprise API Team
    email: api@ecommerce-enterprise.internal
servers:
  - url: https://api.ecommerce-enterprise.internal/api/v1
    description: Production API Gateway
  - url: http://localhost:4000/api/v1
    description: Local Development Environment

tags:
  - name: Authentication & Identity
    description: Registration, JWT OAuth2 token rotation, 2FA, session revocation
  - name: User Profiles & Addresses
    description: Customer and merchant profile management and address book
  - name: Product Catalog & Taxonomy
    description: Hierarchical categories, brands, variants, faceted filtering
  - name: Inventory & Multi-Warehouse
    description: Real-time stock levels, locks, reservation timeouts, transfers
  - name: Shopping Cart & Promotions
    description: Dynamic cart pricing, tiered coupon engine, tax rules
  - name: Order Processing & State Machine
    description: Order lifecycle transitions, invoicing, returns, refunds
  - name: Payment Gateways
    description: Stripe, PayPal, Klarna integrations, webhooks, chargebacks
  - name: Shipping & Logistics
    description: Carrier rate quotes, label generation, checkpoint tracking
  - name: Product Reviews
    description: Verified purchase ratings, helpful voting, sentiment analysis
  - name: Analytics & Reporting
    description: Real-time sales telemetry, cohort analysis, report exports

paths:
  /auth/register:
    post:
      tags: [Authentication & Identity]
      summary: Register a new customer or vendor account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Authentication & Identity]
      summary: Authenticate user credentials
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products:
    get:
      tags: [Product Catalog & Taxonomy]
      summary: Query product catalog with faceted search & filtering
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: categorySlug
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, rating_desc, newest, relevance]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated product results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'

  /orders:
    post:
      tags: [Order Processing & State Machine]
      summary: Place a new order and lock reserved inventory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderDto'
      responses:
        '201':
          description: Order created in PENDING status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailDto'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterDto:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string }

    LoginDto:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 3600 }
        tokenType: { type: string, example: 'Bearer' }

    CreateOrderDto:
      type: object
      required: [shippingAddressId, billingAddressId, paymentMethod]
      properties:
        shippingAddressId: { type: string, format: uuid }
        billingAddressId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [STRIPE_CREDIT_CARD, PAYPAL, APPLE_PAY] }
        couponCode: { type: string }
        customerNotes: { type: string }

    OrderDetailDto:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string, example: 'ORD-9824-AX7' }
        status: { type: string, example: 'CONFIRMED' }
        currency: { type: string, example: 'USD' }
        subtotal: { type: number, example: 349.99 }
        taxAmount: { type: number, example: 32.37 }
        shippingFee: { type: number, example: 0.00 }
        totalAmount: { type: number, example: 382.36 }

  responses:
    BadRequest:
      description: Invalid request parameters or DTO validation failure
    Unauthorized:
      description: Authentication credentials missing or invalid
    Forbidden:
      description: User lacks sufficient RBAC permissions
    NotFound:
      description: Requested entity does not exist
    Conflict:
      description: Unique constraint violation or duplicate resource

global:
  environment: production
  domain: ecommerce-enterprise.internal

api:
  replicaCount: 3
  image:
    repository: enterprise/api-gateway
    tag: 1.0.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

storefront:
  replicaCount: 4
  image:
    repository: enterprise/storefront
    tag: 1.0.0
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi

adminPortal:
  replicaCount: 2
  image:
    repository: enterprise/admin-portal
    tag: 1.0.0

redis:
  architecture: replication
  auth:
    enabled: true
    password: enterprise_redis_secret_2026

postgresql:
  auth:
    username: postgres
    password: enterprise_pg_password_2026
    database: enterprise_ecommerce
  primary:
    persistence:
      enabled: true
      size: 500Gi
